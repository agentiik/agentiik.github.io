<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentiik</title>
<meta name="description" content="Documentation for Agentiik, a multi-user workflow engine in which every brick is an ephemeral OCI container and every workflow is a YAML file.">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<script>document.documentElement.className+=" js"</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;display=swap">
<style>
:root{
  --paper:#F1F3EE;
  --surface:#FBFCF8;
  --ink:#17201C;
  --muted:#5C6A62;
  --faint:#7C887F;
  --line:#D3D9CF;
  --accent:#0E6A5F;
  --shadow:0 1px 2px rgba(23,32,28,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111614;
    --surface:#181E1B;
    --ink:#E5EAE3;
    --muted:#9AA79E;
    --faint:#7E8B83;
    --line:#2A332E;
    --accent:#54C1AD;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --paper:#111614;
  --surface:#181E1B;
  --ink:#E5EAE3;
  --muted:#9AA79E;
  --faint:#7E8B83;
  --line:#2A332E;
  --accent:#54C1AD;
  --shadow:none;
}

*{box-sizing:border-box}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{
  max-width:880px;
  margin:0 auto;
  padding-inline:clamp(16px,3vw,28px);
  padding-block:clamp(96px,16vw,224px) 144px;
}
a{color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}

.hero{
  text-align:center;
  margin-bottom:clamp(76px,12vw,140px);
}
.lockup{
  --mark:clamp(44px,12vw,104px);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:calc(var(--mark) * 9 / 14);
  margin-bottom:clamp(46px,7vw,76px);
}
.hero a{
  display:inline-flex;
  color:var(--muted);
}
.hero a svg{
  display:block;
  width:26px;
  height:26px;
  fill:currentColor;
}
.hero a:hover{color:var(--accent)}
.lockup svg{
  flex:none;
  width:calc(var(--mark) * 16 / 14);
  height:var(--mark);
  fill:var(--accent);
}
.lockup h1{
  font-size:calc(var(--mark) * 15 / 14);
  font-weight:700;
  letter-spacing:-.02em;
  line-height:1;
  margin:0;
}

.shot{
  /* Wider than the text column: the screenshot breaks out of the 880 and stops
     one gutter short of the viewport, so it never brings a horizontal scrollbar. */
  position:relative;
  left:50%;
  transform:translateX(-50%);
  width:min(1240px, calc(100vw - 2 * clamp(16px,3vw,28px)));
  border:1px solid var(--line);
  background:var(--surface);
  box-shadow:var(--shadow);
  margin:0 0 clamp(76px,12vw,140px);
}
.shot img{width:100%;height:auto}
.shot-light,.shot-dark{display:block}
.shot-dark{display:none}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .shot-dark{display:block}
  :root:not([data-theme="light"]) .shot-light{display:none}
}
:root[data-theme="dark"] .shot-dark{display:block}
:root[data-theme="dark"] .shot-light{display:none}

.docs{border-top:1px solid var(--line)}
.docs > *{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:16px;
  padding:30px 2px;
  border-bottom:1px solid var(--line);
  font-size:1.05rem;
  font-weight:500;
  letter-spacing:-.01em;
}
.docs a{
  color:var(--ink);
  text-decoration:none;
}
.docs a::after{
  content:"→";
  color:var(--accent);
}
.docs a:hover{color:var(--accent)}
.docs span.soon{color:var(--faint)}
.docs span.soon::after{
  content:"not written yet";
  font-size:.68rem;
  text-transform:uppercase;
  letter-spacing:.14em;
  font-weight:600;
}

footer{
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  gap:10px 24px;
  margin-top:104px;
  font-size:.8rem;
  color:var(--faint);
}
footer a{color:var(--muted);text-decoration-thickness:1px;text-underline-offset:2px}
footer a:hover{color:var(--accent)}

/* Entrance and parallax. Two typed custom properties rather than one transform:
   the rise is transitioned once on load, the parallax is written on every frame,
   and composing them in calc() means neither overwrites the other, which
   matters for .shot, whose own transform is what centres it. */
@property --rise{syntax:"<length>";inherits:false;initial-value:0px}
@property --par{syntax:"<length>";inherits:false;initial-value:0px}

[data-rise],[data-par]{
  transform:translate3d(0,calc(var(--rise,0px) + var(--par,0px)),0);
}
.shot[data-rise],.shot[data-par]{
  transform:translateX(-50%) translate3d(0,calc(var(--rise,0px) + var(--par,0px)),0);
}
/* Hidden only once scripting has announced itself, so a failed or blocked
   script leaves a readable page rather than an empty one. */
html.js [data-rise]{
  --rise:22px;
  opacity:0;
  transition:opacity .75s cubic-bezier(.22,.61,.24,1) var(--delay,0s),
             --rise .95s cubic-bezier(.22,.61,.24,1) var(--delay,0s);
}
html.js.ready [data-rise]{
  --rise:0px;
  opacity:1;
}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
html{color-scheme:light dark}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>

<main>

<div class="hero">
<div class="lockup" data-rise data-par=".07" style="--delay:0s">

<a href="https://github.com/agentiik" aria-label="Agentiik on GitHub" data-rise data-par=".12" style="--delay:.08s">
  <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>

</div>

<div class="shot" data-rise data-par="-.045" style="--delay:.16s">
  <img class="shot-light" alt="The Agentiik run list: a namespace rail, filter chips, a band of runs needing attention, and a table of runs with state, identifier, workflow, trigger, a per-step progress strip, times and the principal who started each one." src="assets/console-runs-light.png">

</div>

<nav class="docs">
  <a href="docs/index.html" data-rise data-par=".03" style="--delay:.26s">Documentation</a>

  <span class="soon" data-rise data-par=".03" style="--delay:.38s">Language reference</span>

</nav>

<footer data-rise data-par=".05" style="--delay:.52s">
  <span>&copy; 2026 Fran&ccedil;ois Rousselet</span>

</footer>

</main>
<script>
(function(){
  var root = document.documentElement;
  var reduce = window.matchMedia('(prefers-reduced-motion:reduce)');

  // Nothing rises for somebody who asked for less motion; the rule above
  // disables the transition anyway, this also skips the work.
  if(reduce.matches){ root.className += ' ready'; return; }

  // Two frames: the first lets the initial state paint, the second starts the
  // transition. One frame is enough in most browsers and not in all of them.
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){ root.className += ' ready'; });
  });

  var items = Array.prototype.slice.call(document.querySelectorAll('[data-par]')).map(function(el){
    return { el: el, f: parseFloat(el.getAttribute('data-par')) || 0, mid: 0 };
  });
  if(!items.length) return;

  var LIMIT = 34;   // the whole effect stays inside 34 pixels either way

  // offsetTop rather than getBoundingClientRect: it ignores the transform we
  // are about to write, so measuring never feeds back into itself.
  function measure(){
    items.forEach(function(it){
      var top = 0, n = it.el;
      while(n){ top += n.offsetTop; n = n.offsetParent; }
      it.mid = top + it.el.offsetHeight / 2;
    });
  }

  function apply(){
    var mid = (window.scrollY || window.pageYOffset) + window.innerHeight / 2;
    for(var i = 0; i < items.length; i++){
      var it = items[i], y = (mid - it.mid) * it.f;
      if(y > LIMIT) y = LIMIT; else if(y < -LIMIT) y = -LIMIT;
      it.el.style.setProperty('--par', y.toFixed(2) + 'px');
    }
  }

  var queued = false;
  function onScroll(){
    if(queued) return;
    queued = true;
    requestAnimationFrame(function(){ queued = false; apply(); });
  }

  function reset(){ measure(); apply(); }

  reset();
  window.addEventListener('scroll', onScroll, {passive:true});
  window.addEventListener('resize', reset);
  // The screenshot decides the height of the page, so its load moves everything.
  window.addEventListener('load', reset);
  reduce.addEventListener('change', function(){
    if(!reduce.matches) return;
    items.forEach(function(it){ it.el.style.setProperty('--par', '0px'); });
    window.removeEventListener('scroll', onScroll);
  });
})();
</script>
</body>
