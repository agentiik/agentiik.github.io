<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentiik</title>
<meta name="description" content="Documentation for Agentiik, a multi-user workflow engine in which every brick is an ephemeral OCI container and every workflow is a YAML file.">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;display=swap">
<style>
:root{
  --paper:#F1F3EE;
  --surface:#FBFCF8;
  --ink:#17201C;
  --muted:#5C6A62;
  --faint:#7C887F;
  --line:#D3D9CF;
  --accent:#0E6A5F;
  --shadow:0 1px 2px rgba(23,32,28,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111614;
    --surface:#181E1B;
    --ink:#E5EAE3;
    --muted:#9AA79E;
    --faint:#7E8B83;
    --line:#2A332E;
    --accent:#54C1AD;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --paper:#111614;
  --surface:#181E1B;
  --ink:#E5EAE3;
  --muted:#9AA79E;
  --faint:#7E8B83;
  --line:#2A332E;
  --accent:#54C1AD;
  --shadow:none;
}

*{box-sizing:border-box}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{
  max-width:880px;
  margin:0 auto;
  padding-inline:clamp(16px,3vw,28px);
  padding-block:clamp(96px,16vw,224px) 144px;
}
a{color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}

.hero{
  text-align:center;
  margin-bottom:clamp(76px,12vw,140px);
}
.lockup{
  --mark:clamp(44px,12vw,104px);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:calc(var(--mark) * 9 / 14);
  margin-bottom:clamp(46px,7vw,76px);
}
.hero a{
  display:inline-flex;
  color:var(--muted);
}
.hero a svg{
  display:block;
  width:26px;
  height:26px;
  fill:currentColor;
}
.hero a:hover{color:var(--accent)}
.lockup svg{
  flex:none;
  width:calc(var(--mark) * 16 / 14);
  height:var(--mark);
  fill:var(--accent);
}
.lockup h1{
  font-size:calc(var(--mark) * 15 / 14);
  font-weight:700;
  letter-spacing:-.02em;
  line-height:1;
  margin:0;
}

.shot{
  /* Wider than the text column: the screenshot breaks out of the 880 and stops
     one gutter short of the viewport, so it never brings a horizontal scrollbar. */
  position:relative;
  left:50%;
  transform:translateX(-50%);
  width:min(1240px, calc(100vw - 2 * clamp(16px,3vw,28px)));
  border:1px solid var(--line);
  background:var(--surface);
  box-shadow:var(--shadow);
  margin:0 0 clamp(76px,12vw,140px);
}
.shot img{width:100%;height:auto}
.shot-light,.shot-dark{display:block}
.shot-dark{display:none}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .shot-dark{display:block}
  :root:not([data-theme="light"]) .shot-light{display:none}
}
:root[data-theme="dark"] .shot-dark{display:block}
:root[data-theme="dark"] .shot-light{display:none}

.docs{border-top:1px solid var(--line)}
.docs > *{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:16px;
  padding:30px 2px;
  border-bottom:1px solid var(--line);
  font-size:1.05rem;
  font-weight:500;
  letter-spacing:-.01em;
}
.docs a{
  color:var(--ink);
  text-decoration:none;
}
.docs a::after{
  content:"→";
  color:var(--accent);
}
.docs a:hover{color:var(--accent)}
.docs span.soon{color:var(--faint)}
.docs span.soon::after{
  content:"not written yet";
  font-size:.68rem;
  text-transform:uppercase;
  letter-spacing:.14em;
  font-weight:600;
}

footer{
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  gap:10px 24px;
  margin-top:104px;
  font-size:.8rem;
  color:var(--faint);
}
footer a{color:var(--muted);text-decoration-thickness:1px;text-underline-offset:2px}
footer a:hover{color:var(--accent)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
html{color-scheme:light dark}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>

<main>

<div class="hero">
<div class="lockup">
  <svg viewBox="0 0 16 14" aria-hidden="true" focusable="false">
    <rect width="16" height="4" rx="1"/>
    <g opacity=".62">
      <rect y="6" width="7" height="4" rx="1"/>
      <rect x="9" y="6" width="7" height="4" rx="1"/>
    </g>
    <rect y="12" width="16" height="2" rx="1" opacity=".3"/>
  </svg>
  <h1>agentiik</h1>
</div>
<a href="https://github.com/agentiik" aria-label="Agentiik on GitHub">

</div>

<div class="shot">
  <img class="shot-light" alt="The Agentiik run list: a namespace rail, filter chips, a band of runs needing attention, and a table of runs with state, identifier, workflow, trigger, a per-step progress strip, times and the principal who started each one." src="assets/console-runs-light.png">
  <img class="shot-dark" alt="The Agentiik run list: a namespace rail, filter chips, a band of runs needing attention, and a table of runs with state, identifier, workflow, trigger, a per-step progress strip, times and the principal who started each one." src="assets/console-runs-dark.png">
</div>

<nav class="docs">
  <a href="docs/index.html">Documentation</a>
  <a href="docs/roadmap/index.html">Roadmap</a>
  <span class="soon">Language reference</span>
  <span class="soon">API reference</span>
</nav>

<footer>
  <span>&copy; 2026 Fran&ccedil;ois Rousselet</span>
  <a href="legal/index.html">Legal notice</a>
</footer>

</main>
</body>
</html>
