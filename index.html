<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentiik</title>
<meta name="description" content="Documentation for Agentiik, a multi-user workflow engine in which every brick is an ephemeral OCI container and every workflow is a YAML file.">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<script>(function(){var r=document.documentElement;r.className+=" js";try{localStorage.removeItem("agentiik-theme")}catch(e){}})()</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
/* The design system's tokens, the same as the documentation's. */
:root{
  --paper:#EFF2ED;
  --surface:#FBFCF9;
  --sunken:#E7EBE3;
  --raised:#FFFFFF;
  --ink:#16201B;
  --muted:#5A6961;
  --faint:#7E8C84;
  --line:#DCE2D7;
  --line-strong:#C0CABB;
  --accent:#0E6A5F;
  --scrim:rgba(14,19,16,.42);
  --shadow:none;
  --gutter:clamp(16px,3vw,28px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1310;
    --surface:#151C18;
    --sunken:#0A0F0C;
    --raised:#1B2420;
    --ink:#E4EAE3;
    --muted:#94A29A;
    --faint:#6D7B73;
    --line:#26312B;
    --line-strong:#35423A;
    --accent:#4FBFAC;
    --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#0E1310;
  --surface:#151C18;
  --sunken:#0A0F0C;
  --raised:#1B2420;
  --ink:#E4EAE3;
  --muted:#94A29A;
  --faint:#6D7B73;
  --line:#26312B;
  --line-strong:#35423A;
  --accent:#4FBFAC;
  --scrim:rgba(0,0,0,.6);
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}

*{box-sizing:border-box}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{
  max-width:880px;
  margin:0 auto;
  padding-inline:clamp(16px,3vw,28px);
  padding-block:clamp(96px,16vw,224px) 144px;
}
a{color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}

.hero{
  text-align:center;
  margin-bottom:clamp(76px,12vw,140px);
}
.lockup{
  --mark:clamp(44px,12vw,104px);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:calc(var(--mark) * 9 / 14);
  margin-bottom:clamp(46px,7vw,76px);
}
/* The one thing the page asks a reader to do. Under the lockup, the size of a
   sentence rather than of a button: the page is quiet and a loud control in the
   middle of it would be the only thing anybody saw. */
.hero .start{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:13px 20px 13px 24px;
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--surface);
  box-shadow:var(--shadow);
  color:var(--ink);
  font-size:clamp(1rem,1.6vw,1.12rem);
  font-weight:500;
  letter-spacing:-.015em;
  text-decoration:none;
}
.hero .start:hover{border-color:var(--accent);color:var(--accent)}
.hero .start svg{
  display:block;
  width:14px;
  height:14px;
  color:var(--accent);
}
.hero .start:hover svg{color:inherit}
.lockup svg{
  flex:none;
  width:calc(var(--mark) * 16 / 14);
  height:var(--mark);
  fill:var(--accent);
}
.lockup h1{
  font-size:calc(var(--mark) * 15 / 14);
  font-weight:700;
  letter-spacing:-.02em;
  line-height:1;
  margin:0;
}

.shot{
  /* Wider than the text column: the screenshot breaks out of the 880 and stops
     one gutter short of the viewport, so it never brings a horizontal scrollbar. */
  position:relative;
  left:50%;
  transform:translateX(-50%);
  width:min(1240px, calc(100vw - 2 * clamp(16px,3vw,28px)));
  border:1px solid var(--line);
  background:var(--surface);
  box-shadow:var(--shadow);
  margin:0 0 clamp(76px,12vw,140px);
}
.shot img{width:100%;height:auto}
.shot-light,.shot-dark{display:block}
.shot-dark{display:none}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .shot-dark{display:block}
  :root:not([data-theme="light"]) .shot-light{display:none}
}
:root[data-theme="dark"] .shot-dark{display:block}
:root[data-theme="dark"] .shot-light{display:none}

.docs{border-top:1px solid var(--line)}
.docs > *{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:16px;
  padding:30px 2px;
  border-bottom:1px solid var(--line);
  font-size:1.05rem;
  font-weight:500;
  letter-spacing:-.01em;
}
.docs a{
  color:var(--ink);
  text-decoration:none;
}
.docs a::after{
  content:"→";
  color:var(--accent);
}
.docs a:hover{color:var(--accent)}
.docs span.soon{color:var(--faint)}
.docs span.soon::after{
  content:"not written yet";
  font-size:.68rem;
  text-transform:uppercase;
  letter-spacing:.14em;
  font-weight:600;
}

.ends{display:flex;gap:24px}
footer{
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  gap:10px 24px;
  margin-top:104px;
  font-size:.8rem;
  color:var(--faint);
}
footer a{color:var(--muted);text-decoration-thickness:1px;text-underline-offset:2px}
footer a:hover{color:var(--accent)}

/* Entrance and parallax. Two typed custom properties rather than one transform:
   the rise is transitioned once on load, the parallax is written on every frame,
   and composing them in calc() means neither overwrites the other, which
   matters for .shot, whose own transform is what centres it. */
@property --rise{syntax:"<length>";inherits:false;initial-value:0px}
@property --par{syntax:"<length>";inherits:false;initial-value:0px}

[data-rise],[data-par]{
  transform:translate3d(0,calc(var(--rise,0px) + var(--par,0px)),0);
}
.shot[data-rise],.shot[data-par]{
  transform:translateX(-50%) translate3d(0,calc(var(--rise,0px) + var(--par,0px)),0);
}
/* Hidden only once scripting has announced itself, so a failed or blocked
   script leaves a readable page rather than an empty one. */
html.js [data-rise]{
  --rise:22px;
  opacity:0;
  transition:opacity .75s cubic-bezier(.22,.61,.24,1) var(--delay,0s),
             --rise .95s cubic-bezier(.22,.61,.24,1) var(--delay,0s);
}
html.js.ready [data-rise]{
  --rise:0px;
  opacity:1;
}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* The recorded session. It is text on the page, and a player only if somebody asks for
   one: the player is a quarter of a megabyte from a CDN, and a home page that fetched it
   for every visitor to show a terminal nobody pressed play on would be spending somebody
   else's bandwidth on decoration. */
.cast{
  position:relative;
  left:50%;
  transform:translateX(-50%);
  width:min(1240px, calc(100vw - 2 * clamp(16px,3vw,28px)));
  margin:0 0 clamp(76px,12vw,140px);
}
.cast-frame{
  position:relative;
  border:1px solid var(--line);
  background:var(--surface);
  box-shadow:var(--shadow);
}
.cast pre{
  margin:0;
  padding:20px clamp(14px,2vw,22px) 60px;
  max-height:min(60vh,440px);
  overflow:auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:clamp(.66rem,1.15vw,.78rem);
  line-height:1.75;
  color:var(--ink);
  white-space:pre-wrap;
  word-break:break-word;
  overflow-wrap:anywhere;
}
.cast pre .p{color:var(--accent);user-select:none}
.cast pre .cmd{font-weight:600}
/* The fade says there is more below without hiding it: the block scrolls. */
.cast-frame::after{
  content:"";
  position:absolute;
  inset:auto 0 0 0;
  height:72px;
  background:linear-gradient(to bottom,transparent,var(--surface));
  pointer-events:none;
}
.cast-frame:has(.cast-player:not([hidden]))::after{display:none}
.cast-play{
  position:absolute;
  right:clamp(12px,2vw,18px);
  bottom:clamp(12px,2vw,18px);
  z-index:1;
  display:inline-flex;
  align-items:center;
  gap:9px;
  padding:9px 15px 9px 12px;
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--paper);
  color:var(--ink);
  font:inherit;
  font-size:.82rem;
  font-weight:500;
  letter-spacing:-.01em;
  cursor:pointer;
}
.cast-play:hover{border-color:var(--accent);color:var(--accent)}
.cast-play:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.cast-play:disabled{cursor:default;color:var(--muted)}
.cast-play svg{width:12px;height:12px;fill:currentColor}
.cast-player{padding:14px clamp(10px,1.6vw,16px)}
.cast figcaption{
  margin-top:14px;
  color:var(--muted);
  font-size:.86rem;
  line-height:1.6;
}
.cast figcaption b{color:var(--ink);font-weight:600}
/* The player's own palette, set to this page's rather than left at its default black: a
   terminal that does not belong to the page it sits on reads as an image somebody pasted. */
.asciinema-player-theme-agentiik{
  --term-color-foreground:#17201C;
  --term-color-background:#FBFCF8;
  --term-color-0:#3A463F; --term-color-1:#A8481B; --term-color-2:#0E6A5F;
  --term-color-3:#8A6A1F; --term-color-4:#2F5E86; --term-color-5:#7A4B86;
  --term-color-6:#12776C; --term-color-7:#17201C;
  --term-color-8:#7C887F; --term-color-9:#C25A22; --term-color-10:#12897A;
  --term-color-11:#A8842A; --term-color-12:#3D74A3; --term-color-13:#9460A3;
  --term-color-14:#189387; --term-color-15:#0B0F0D;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .asciinema-player-theme-agentiik{
    --term-color-foreground:#E5EAE3;
    --term-color-background:#181E1B;
    --term-color-0:#2A332E; --term-color-1:#E0834F; --term-color-2:#54C1AD;
    --term-color-3:#D6B45C; --term-color-4:#7FB0DA; --term-color-5:#C39AD4;
    --term-color-6:#6FD4C4; --term-color-7:#E5EAE3;
    --term-color-8:#7E8B83; --term-color-9:#EC9A6A; --term-color-10:#74D6C4;
    --term-color-11:#E6C87A; --term-color-12:#9AC4E8; --term-color-13:#D3B0E2;
    --term-color-14:#8AE2D3; --term-color-15:#FFFFFF;
  }
}
:root[data-theme="dark"] .asciinema-player-theme-agentiik{
  --term-color-foreground:#E5EAE3;
  --term-color-background:#181E1B;
  --term-color-0:#2A332E; --term-color-1:#E0834F; --term-color-2:#54C1AD;
  --term-color-3:#D6B45C; --term-color-4:#7FB0DA; --term-color-5:#C39AD4;
  --term-color-6:#6FD4C4; --term-color-7:#E5EAE3;
  --term-color-8:#7E8B83; --term-color-9:#EC9A6A; --term-color-10:#74D6C4;
  --term-color-11:#E6C87A; --term-color-12:#9AC4E8; --term-color-13:#D3B0E2;
  --term-color-14:#8AE2D3; --term-color-15:#FFFFFF;
}

/* ---------- Redesign: width, sharpness, interaction ---------- */
body{overflow-x:clip}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:2px}
/* The screenshot and the recording take the screen's width, up to the 1440 the console is
   drawn at, and stop one gutter short of either edge. */
.shot,.cast{width:min(1440px, calc(100vw - 2 * var(--gutter)))}
.shot{border-radius:7px;overflow:hidden}
.shot .mock{display:block;width:100%;height:auto}
.cast-frame{border-radius:7px;overflow:hidden}
.cast pre{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.hero .start{transition:border-color .12s ease,color .12s ease}
.docs a{transition:color .12s ease}
.docs a::after{transition:transform .15s ease}
.docs a:hover::after{transform:translateX(4px)}

.page-tools{position:fixed;top:12px;right:var(--gutter);z-index:30;display:flex;gap:8px}
.icon-btn{
  display:inline-grid;place-items:center;width:34px;height:34px;padding:0;
  border:1px solid var(--line);border-radius:5px;background:var(--raised);color:var(--muted);cursor:pointer;
}
.icon-btn:hover{color:var(--ink);border-color:var(--line-strong)}
.icon-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.menu-btn{display:none}

.zoom-btn{
  position:absolute;top:10px;right:10px;z-index:2;display:inline-grid;place-items:center;width:32px;height:32px;padding:0;
  color:var(--muted);background:var(--raised);border:1px solid var(--line);border-radius:5px;cursor:zoom-in;
  opacity:0;transition:opacity .12s ease;
}
.shot:hover .zoom-btn,.zoom-btn:focus-visible{opacity:1}
@media (hover:none){.zoom-btn{opacity:1}}
.zoom-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.shot[data-zoom] .mock{cursor:zoom-in}

.lightbox{width:100vw;height:100vh;width:100dvw;height:100dvh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:transparent;color:var(--ink);overflow:hidden}
.lightbox::backdrop{background:var(--scrim)}
.lightbox-frame{position:absolute;inset:clamp(8px,3vw,40px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-strong);border-radius:7px;overflow:hidden}
.lightbox-bar{flex:none;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-bottom:1px solid var(--line);font-size:.82rem;color:var(--muted)}
.lightbox-bar .lightbox-title{flex:1;min-width:0}
.lightbox-body{flex:1;min-height:0;overflow:auto;display:grid;place-items:center;padding:clamp(8px,2vw,28px);cursor:zoom-out}
.lightbox-body > *{display:block;width:100%;max-width:1800px;min-width:1200px;height:auto}
@media (min-width:980px){.lightbox-body > *{min-width:0}}
/* Console mockups: one markup, both themes, from the design system's tokens. */

:root[data-theme="dark"] .mock{--m-bg:#0E1310;--m-surface:#151C18;--m-pane:#0A0F0C;--m-sunken:#0A0F0C;--m-raised:#1B2420;--m-line:#26312B;--m-line-strong:#35423A;--m-text:#E4EAE3;--m-muted:#94A29A;--m-faint:#6D7B73;--m-accent:#4FBFAC;--m-accent-dim:#12302A;--m-accent-line:#21473F;--m-on-accent:#0E1310;--m-ok:#5FA773;--m-ok-bg:#132A1C;--m-ok-line:#264B33;--m-wait:#D9A441;--m-wait-bg:#2E2413;--m-wait-line:#5B461E;--m-fail:#E0705A;--m-fail-bg:#31190F;--m-fail-line:#5F3023;}

user namespace remapping is off on this daemon and this runner does not require it, so the floor is lifted: a task's files are owned by a real uid on the host, root inside a container is the host's own root, and a process that escapes a container is that account rather than an unprivileged high-numbered one that maps to no real user.
this daemon applies neither an AppArmor profile nor an SELinux label to a container, which is the host's to offer, so a container is held by its namespaces, its dropped capabilities and its seccomp profile with no mandatory access control behind them.

        current = active;
        var a = map[current.id];
        if(a){
          a.setAttribute('aria-current', 'true');
          reveal(a);
          scrollIntoNav(a);
        }
      }
      if(rail && wide.matches){
        buildRail(sectionOf(current));
        var ra = null;
        for(var j = 0; j < railTargets.length; j++){
          if(railTargets[j].getBoundingClientRect().top <= line){ ra = railTargets[j]; } else { break; }
        }
        if(atEnd && railTargets.length) ra = railTargets[railTargets.length - 1];
        if(ra !== railCurrent){
          if(railCurrent && railMap[railCurrent.id]) railMap[railCurrent.id].removeAttribute('aria-current');
          railCurrent = ra;
          if(ra && railMap[ra.id]) railMap[ra.id].setAttribute('aria-current', 'true');
        }
      }
    }

    // A chosen chapter closes the drawer, so the reader lands on the text.
    nav.addEventListener('click', function(e){
      var t = e.target;
      while(t && t !== nav && t.tagName !== 'A'){ t = t.parentNode; }
      if(t && t.tagName === 'A' && narrow.matches) setNav(false);
    });

    var queued = false;
    function onScroll(){
      if(queued) return;
      queued = true;
      window.requestAnimationFrame(function(){ queued = false; sync(); });
    }
    window.addEventListener('scroll', onScroll, {passive: true});
    window.addEventListener('resize', onScroll);
    wide.addEventListener('change', function(){ railSection = null; sync(); });
    sync();
  }

  // ---------- Headings: a link to each one that has an address ----------
  $all('main section[id] > .sec-head h2, main h3[id], main h4[id]').forEach(function(h){
    var id = h.id || h.closest('section').id;
    if(!id || h.querySelector('.anchor')) return;
    var a = doc.createElement('a');
    a.className = 'anchor';
    a.href = '#' + id;
    a.textContent = '#';
    a.setAttribute('aria-label', 'Link to ' + h.textContent);
    h.appendChild(a);
  });

  // ---------- Tables: each in its own scroller ----------
  $all('main table').forEach(function(t){
    var wrap = t.parentNode;
    if(!wrap.classList || !wrap.classList.contains('tablewrap')){
      wrap = doc.createElement('div');
      wrap.className = 'tablewrap';
      t.parentNode.insertBefore(wrap, t);
      wrap.appendChild(t);
    }
  });
  // A scroller whose content is wider than it can be scrolled with the keyboard too.
  function scrollers(){
    $all('.tablewrap, .block pre, .figbody').forEach(function(el){
      var over = el.scrollWidth > el.clientWidth + 1;
      if(over && !el.hasAttribute('tabindex')){
        el.setAttribute('tabindex', '0');
        el.setAttribute('data-kbd', '');
        if(!el.hasAttribute('role')){
          el.setAttribute('role', 'region');
          var what = el.classList.contains('tablewrap') ? 'Table' : el.tagName === 'PRE' ? 'Code' : 'Figure';
          el.setAttribute('aria-label', what + ', scrolls sideways');
        }
      } else if(!over && el.hasAttribute('data-kbd')){
        el.removeAttribute('tabindex'); el.removeAttribute('data-kbd');
        el.removeAttribute('role'); el.removeAttribute('aria-label');
      }
    });
  }
  scrollers();
  var rq = null;
  window.addEventListener('resize', function(){ clearTimeout(rq); rq = setTimeout(scrollers, 150); });
  window.addEventListener('load', scrollers);

  // ---------- Code: a copy button on every block ----------
  // What is copied is what a reader would type: the commands without their prompt, and a
  // here-document's body with them, but not the output a terminal answered. A block with no
  // prompt at all is a file, and is copied whole.
  function copyText(pre){
    var clone = pre.cloneNode(true);
    var prompts = clone.querySelectorAll('.p');
    if(!prompts.length) return pre.textContent.replace(/\n$/, '');
    Array.prototype.forEach.call(prompts, function(p){ p.textContent = '\u0001'; });
    var lines = clone.textContent.split('\n'), out = [], heredoc = null;
    lines.forEach(function(l){
      if(heredoc !== null){
        out.push(l);
        if(l.trim() === heredoc) heredoc = null;
        return;
      }
      if(l.charAt(0) === '\u0001'){
        var cmd = l.slice(1).replace(/^ /, '');
        out.push(cmd);
        var m = cmd.match(/<<-?\s*['"]?([A-Za-z_][A-Za-z0-9_]*)['"]?/);
        if(m) heredoc = m[1];
      }
    });
    return out.join('\n');
  }
  function writeClipboard(text){
    if(navigator.clipboard && window.isSecureContext){
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function(resolve, reject){
      var ta = doc.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.opacity = '0'; ta.style.top = '0';
      doc.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = doc.execCommand('copy'); } catch(e) {}
      doc.body.removeChild(ta);
      ok ? resolve() : reject();
    });
  }
  $all('.block').forEach(function(block){
    var pre = block.querySelector('pre');
    if(!pre || block.querySelector('.copy-btn')) return;
    var btn = doc.createElement('button');
    btn.type = 'button';
    btn.className = 'copy-btn';
    btn.innerHTML = ICON.copy + '<span>Copy</span>';
    var label = block.querySelector('.note-label');
    btn.setAttribute('aria-label', 'Copy' + (label ? ' ' + label.textContent.trim() : ' this block'));
    var status = btn.querySelector('span');
    var timer = null;
    btn.addEventListener('click', function(){
      writeClipboard(copyText(pre)).then(function(){
        btn.setAttribute('data-state', 'done');
        btn.innerHTML = ICON.check + '<span>Copied</span>';
      }, function(){
        btn.innerHTML = ICON.copy + '<span>Select and copy</span>';
      }).then(function(){
        clearTimeout(timer);
        timer = setTimeout(function(){
          btn.removeAttribute('data-state');
          btn.innerHTML = ICON.copy + '<span>Copy</span>';
        }, 1800);
      });
    });
    if(label){
      var text = doc.createElement('span');
      text.className = 'label-text';
      while(label.firstChild) text.appendChild(label.firstChild);
      label.appendChild(text);
      label.appendChild(btn);
    } else {
      block.appendChild(btn);
    }
  });

  // ---------- Tabs: files that are alternatives to one another ----------
  $all('.tabset').forEach(function(set, n){
    var panels = [], byName = {};
    $all(':scope > [data-tab]', set).forEach(function(el){
      var name = el.getAttribute('data-tab');
      if(!byName[name]){
        var panel = doc.createElement('div');
        panel.className = 'tabpanel';
        panel.setAttribute('role', 'tabpanel');
        byName[name] = panel;
        panels.push({name: name, panel: panel});
        set.insertBefore(panel, el);
      }
      byName[name].appendChild(el);
    });
    if(panels.length < 2) return;
    var list = doc.createElement('div');
    list.className = 'tablist';
    list.setAttribute('role', 'tablist');
    if(set.getAttribute('aria-label')) list.setAttribute('aria-label', set.getAttribute('aria-label'));
    var tabs = panels.map(function(p, i){
      var id = 'tab-' + n + '-' + i;
      var t = doc.createElement('button');
      t.type = 'button';
      t.id = id;
      t.setAttribute('role', 'tab');
      t.textContent = p.name;
      p.panel.id = id + '-panel';
      p.panel.setAttribute('aria-labelledby', id);
      t.setAttribute('aria-controls', p.panel.id);
      list.appendChild(t);
      return t;
    });
    function select(i, focus){
      tabs.forEach(function(t, j){
        var on = i === j;
        t.setAttribute('aria-selected', on ? 'true' : 'false');
        t.tabIndex = on ? 0 : -1;
        panels[j].panel.hidden = !on;
      });
      if(focus) tabs[i].focus();
      scrollers();
    }
    tabs.forEach(function(t, i){
      t.addEventListener('click', function(){ select(i); });
      t.addEventListener('keydown', function(e){
        var k = e.key, j = null;
        if(k === 'ArrowRight') j = (i + 1) % tabs.length;
        else if(k === 'ArrowLeft') j = (i - 1 + tabs.length) % tabs.length;
        else if(k === 'Home') j = 0;
        else if(k === 'End') j = tabs.length - 1;
        if(j !== null){ e.preventDefault(); select(j, true); }
      });
    });
    set.insertBefore(list, set.firstChild);
    set.classList.add('is-tabbed');
    select(0);
  });

  // ---------- Figures: enlarge on click, close with Escape ----------
  var box = null, boxBody = null, boxTitle = null, lastFocus = null;
  function lightbox(){
    if(box) return box;
    box = doc.createElement('dialog');
    box.className = 'lightbox';
    box.setAttribute('aria-label', 'Enlarged figure');
    box.innerHTML = '<div class="lightbox-frame"><div class="lightbox-bar"><span class="lightbox-title"></span>' +
      '<button type="button" class="icon-btn" aria-label="Close the enlarged figure">' + ICON.close + '</button></div>' +
      '<div class="lightbox-body"></div></div>';
    boxBody = box.querySelector('.lightbox-body');
    boxTitle = box.querySelector('.lightbox-title');
    box.querySelector('.icon-btn').addEventListener('click', function(){ box.close(); });
    boxBody.addEventListener('click', function(e){
      // A click on the drawing closes it, but a drag to pan it does not.
      if(!window.getSelection || String(window.getSelection()) === '') box.close();
    });
    box.addEventListener('click', function(e){ if(e.target === box) box.close(); });
    box.addEventListener('close', function(){
      boxBody.innerHTML = '';
      root.classList.remove('lightbox-open');
      if(lastFocus) lastFocus.focus({preventScroll: true});
    });
    doc.body.appendChild(box);
    return box;
  }
  function visibleArt(fig){
    var candidates = $all('.figbody > svg, :scope > svg, :scope > img', fig);
    for(var i = 0; i < candidates.length; i++){
      if(candidates[i].getClientRects().length) return candidates[i];
    }
    return candidates[0];
  }
  function enlarge(fig, from){
    var art = visibleArt(fig);
    if(!art || typeof HTMLDialogElement !== 'function') return;
    lightbox();
    lastFocus = from || null;
    var copy = art.cloneNode(true);
    copy.removeAttribute('id');
    $all('[id]', copy).forEach(function(el){ el.removeAttribute('id'); });
    if(art.classList.contains('mock')) copy.classList.add('is-mock');
    copy.style.minWidth = '';
    boxBody.appendChild(copy);
    var cap = fig.querySelector('figcaption b');
    boxTitle.innerHTML = cap ? '<b></b>' : '';
    if(cap) boxTitle.firstChild.textContent = cap.textContent;
    root.classList.add('lightbox-open');
    box.showModal();
    box.querySelector('.icon-btn').focus({preventScroll: true});
  }
  $all('main figure, .shot').forEach(function(fig){
    if(fig.classList.contains('cast') || !visibleArt(fig)) return;
    fig.setAttribute('data-zoom', '');
    var btn = doc.createElement('button');
    btn.type = 'button';
    btn.className = 'zoom-btn';
    btn.innerHTML = ICON.zoom;
    var cap = fig.querySelector('figcaption b');
    btn.setAttribute('aria-label', 'Enlarge the figure' + (cap ? ': ' + cap.textContent : ''));
    btn.title = 'Enlarge';
    btn.addEventListener('click', function(e){ e.stopPropagation(); enlarge(fig, btn); });
    fig.appendChild(btn);
    fig.addEventListener('click', function(e){
      if(e.target.closest('a, button, figcaption')) return;
      // A horizontal drag to scroll a wide figure on a phone is not a request to enlarge it.
      if(String(window.getSelection ? window.getSelection() : '') !== '') return;
      enlarge(fig, btn);
    });
  });
})();
</script>
<script>
(function(){
  var root = document.documentElement;
  var reduce = window.matchMedia('(prefers-reduced-motion:reduce)');

  // Nothing rises for somebody who asked for less motion; the rule above
  // disables the transition anyway, this also skips the work.
  if(reduce.matches){ root.className += ' ready'; return; }

  // Two frames: the first lets the initial state paint, the second starts the
  // transition. One frame is enough in most browsers and not in all of them.
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){ root.className += ' ready'; });
  });

  var items = Array.prototype.slice.call(document.querySelectorAll('[data-par]')).map(function(el){
    return { el: el, f: parseFloat(el.getAttribute('data-par')) || 0, mid: 0 };
  });
  if(!items.length) return;

  var LIMIT = 34;   // the whole effect stays inside 34 pixels either way

  // offsetTop rather than getBoundingClientRect: it ignores the transform we
  // are about to write, so measuring never feeds back into itself.
  function measure(){
    items.forEach(function(it){
      var top = 0, n = it.el;
      while(n){ top += n.offsetTop; n = n.offsetParent; }
      it.mid = top + it.el.offsetHeight / 2;
    });
  }

  function apply(){
    var mid = (window.scrollY || window.pageYOffset) + window.innerHeight / 2;
    for(var i = 0; i < items.length; i++){
      var it = items[i], y = (mid - it.mid) * it.f;
      if(y > LIMIT) y = LIMIT; else if(y < -LIMIT) y = -LIMIT;
      it.el.style.setProperty('--par', y.toFixed(2) + 'px');
    }
  }

  var queued = false;
  function onScroll(){
    if(queued) return;
    queued = true;
    requestAnimationFrame(function(){ queued = false; apply(); });
  }

  function reset(){ measure(); apply(); }

  reset();
  window.addEventListener('scroll', onScroll, {passive:true});
  window.addEventListener('resize', reset);
  // The screenshot decides the height of the page, so its load moves everything.
  window.addEventListener('load', reset);
  reduce.addEventListener('change', function(){
    if(!reduce.matches) return;
    items.forEach(function(it){ it.el.style.setProperty('--par', '0px'); });
    window.removeEventListener('scroll', onScroll);
  });
})();
</script>
<script>
// The player is fetched when somebody presses play, and never before. Until then the
// session is the text already on the page, which is readable, selectable and there with
// no JavaScript at all.
(function(){
  var button = document.getElementById('cast-play');
  var mount = document.getElementById('cast-player');
  var poster = document.getElementById('cast-poster');
  if(!button || !mount || !poster) return;

  var BASE = 'https://cdn.jsdelivr.net/npm/asciinema-player@3.10.0/dist/bundle/';
  var label = button.querySelector('span');

  function load(){
    return new Promise(function(resolve, reject){
      var css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = BASE + 'asciinema-player.css';
      document.head.appendChild(css);
      var js = document.createElement('script');
      js.src = BASE + 'asciinema-player.min.js';
      js.onload = resolve;
      js.onerror = reject;
      document.head.appendChild(js);
    });
  }

  button.addEventListener('click', function(){
    button.disabled = true;
    label.textContent = 'Loading the player';
    load().then(function(){
      poster.hidden = true;
      mount.hidden = false;
      button.hidden = true;
      window.AsciinemaPlayer.create('assets/agk-home.cast', mount, {
        autoPlay: true,
        idleTimeLimit: 1.5,
        fit: 'width',
        theme: 'agentiik',
        terminalFontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'
      });
    }).catch(function(){
      // The CDN is somebody else's machine. Where it is not there the page keeps the
      // text it already had, and the button says why it did nothing.
      button.disabled = false;
      label.textContent = 'The player could not be loaded';
    });
  });
})();
</script>
