# Publishes the documentation to https://agentiik.github.io/.
#
# The site is this repository. There is no build step: the HTML documents and the
# images they reference are copied as they are and handed to Pages, which is what
# lets any document be opened straight from a clone as well.
#
# The Pages source has to be GitHub Actions rather than a branch; the configure
# step sets that on the first run.

name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# A tag does not trigger this, and it cannot usefully. Pages serves the deployment made
# from its source branch, which is main: a run triggered by a tag builds the right site,
# creates a deployment, is reported as succeeding, and the live site never changes. That
# was tried on v0.1.2 and the CDN went on serving the previous release for half an hour
# while three green checkmarks said otherwise, which is worse than no trigger at all.
#
# So a release ends with a run of this workflow rather than with the tag: merge the
# changelog, tag, then run it from main, where it reads the tags and archives the new
# version. Releasing is a sequence somebody follows, and the sequence is written in
# https://agentiik.github.io/docs#conventions-across-repositories rather than guessed.

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that is already running: a
# half-published site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags, so past versions can be archived beside the current one

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      # The tree is the site: a document's path in the repository is its path on
      # the site, so nothing here names documents one by one. The script adds
      # one archived copy of docs/ per released tag, and decides which of them
      # /docs serves; it still builds no document.
      - name: Assemble the site
        run: python3 .github/build-site.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
