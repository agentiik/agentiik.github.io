# Keeps the roadmap showing what is actually done.
#
# The roadmap is the plan and the issues are the record. This reads the record
# and marks the plan, committing only when the page would say something
# different from what it says now.
#
# It runs on demand and nowhere else, for one reason worth writing down. The
# tasks live in twelve repositories, and the default GITHUB_TOKEN reaches only
# the one it runs in. An issues trigger here would fire on this repository's own
# issues and miss every other, and a schedule would run with the same blind
# token. The marker refuses to write on a partial read rather than striking
# nothing through and calling that the truth, so a scheduled run would fail
# daily and tell nobody anything.
#
# To run it on a schedule, give it a token that can read issues across the
# organisation, put it in ORG_READ_TOKEN, and add the schedule back.

name: Roadmap

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roadmap
  cancel-in-progress: true

jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Mark what is done
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 .github/sync-roadmap.py

      - name: Commit when the page changed
        run: |
          if git diff --quiet docs/roadmap/index.html; then
            echo "nothing to mark"
            exit 0
          fi
          git config user.name "François Rousselet"
          git config user.email "francois.rousselet@rslt.fr"
          git add docs/roadmap/index.html
          git commit -m "Mark the roadmap with what is done"
          git push
